# Fork-only publish. The upstream docker-build.yml stays disabled in this
# repository; this workflow is the one that pushes to our GHCR package.
name: Publish image

on:
  workflow_dispatch:
    inputs:
      image_suffix:
        description: Suffix after the tools version (3.1.20260812-webui.1)
        required: true
        default: webui.1
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILDKIT: 1

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve versions
        id: versions
        run: |
          AWG_GO=$(grep '^ARG AMNEZIAWG_GO_VERSION=' Dockerfile | cut -d= -f2)
          AWG_TOOLS=$(grep '^ARG AMNEZIAWG_TOOLS_VERSION=' Dockerfile | cut -d= -f2)
          SUFFIX=$(printf '%s' "${{ github.event.inputs.image_suffix }}" | tr -d '[:space:]')
          if [[ -z "$AWG_GO" || -z "$AWG_TOOLS" ]]; then
            echo "::error::Could not read Dockerfile ARG pins"
            exit 1
          fi
          if [[ ! "$SUFFIX" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::image_suffix must be a Docker tag fragment, e.g. webui.1"
            exit 1
          fi
          TOOLS_VERSION="${AWG_TOOLS#v}"
          IMAGE_TAG="${TOOLS_VERSION}-${SUFFIX}"
          echo "amneziawg_go=${AWG_GO}" >> "$GITHUB_OUTPUT"
          echo "amneziawg_tools=${AWG_TOOLS}" >> "$GITHUB_OUTPUT"
          echo "tools_version=${TOOLS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${IMAGE_TAG} (go=${AWG_GO} tools=${AWG_TOOLS})"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.versions.outputs.image_tag }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VERSION=${{ steps.versions.outputs.image_tag }}
            AMNEZIAWG_GO_VERSION=${{ steps.versions.outputs.amneziawg_go }}
            AMNEZIAWG_TOOLS_VERSION=${{ steps.versions.outputs.amneziawg_tools }}
          provenance: false
          sbom: false
