{{define "account"}}
<!DOCTYPE html>
<html lang="en" data-theme="{{.Theme}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account — AmneziaWG Panel</title>
  {{template "styles"}}
</head>
<body>
  {{template "nav" .}}
  <main>
    <h1>Account</h1>
    {{if .Flash}}<div class="flash">{{.Flash}}</div>{{end}}
    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    <div class="card">
      <p>Current username: <strong>{{.Username}}</strong></p>
      <form method="post" action="/account">
        <label for="current_password">Current password</label>
        <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
        <label for="new_username">New username</label>
        <input id="new_username" name="new_username" type="text" autocomplete="username" placeholder="leave empty to keep">
        <label for="new_password">New password</label>
        <input id="new_password" name="new_password" type="password" autocomplete="new-password">
        <label for="confirm_password">Confirm password</label>
        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password">
        <p class="actions"><button type="submit">Save</button></p>
      </form>
    </div>
  </main>
</body>
</html>
{{end}}
