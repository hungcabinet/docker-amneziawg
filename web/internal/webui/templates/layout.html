{{define "styles"}}
<style>
  :root, html[data-theme="light"] {
    --bg: #f3f4f6;
    --card: #ffffff;
    --ink: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #1d4ed8;
    --accent-ink: #ffffff;
    --ok: #15803d;
    --ok-bg: #dcfce7;
    --bad: #b91c1c;
    --bad-bg: #fee2e2;
    --btn-secondary: #374151;
    color-scheme: light;
  }
  html[data-theme="dark"] {
    --bg: #111827;
    --card: #1f2937;
    --ink: #f9fafb;
    --muted: #9ca3af;
    --line: #374151;
    --accent: #60a5fa;
    --accent-ink: #111827;
    --ok: #86efac;
    --ok-bg: #14532d;
    --bad: #fca5a5;
    --bad-bg: #7f1d1d;
    --btn-secondary: #4b5563;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.45;
  }
  a { color: var(--accent); }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 0.75rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    min-width: 0;
  }
  header strong { font-size: 1.05rem; }
  nav { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
  nav a, nav button.link, button.link {
    color: var(--ink);
    text-decoration: none;
    background: none;
    border: 0;
    font: inherit;
    cursor: pointer;
    padding: 0.25rem 0;
    min-height: 2.5rem;
  }
  nav a:hover, nav button.link:hover, button.link:hover { color: var(--accent); }
  main { max-width: 960px; margin: 1.5rem auto; padding: 0 1rem 3rem; }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1rem 1.1rem;
    margin-bottom: 0.85rem;
  }
  .row { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .badge {
    display: inline-block;
    border-radius: 999px;
    padding: 0.1rem 0.55rem;
    font-size: 0.8rem;
  }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .flash { background: var(--ok-bg); color: var(--ok); padding: 0.7rem 0.9rem; border-radius: 8px; margin-bottom: 1rem; }
  .error { background: var(--bad-bg); color: var(--bad); padding: 0.7rem 0.9rem; border-radius: 8px; margin-bottom: 1rem; }
  label { display: block; font-size: 0.9rem; margin: 0.7rem 0 0.25rem; }
  input[type=text], input[type=password] {
    width: 100%;
    max-width: 28rem;
    padding: 0.6rem 0.7rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    font: inherit;
    appearance: none;
    background-color: var(--bg);
    box-shadow: inset 0 0 0 999px var(--bg);
    color: var(--ink);
  }
  button, .btn {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-ink);
    border: 0;
    border-radius: 6px;
    padding: 0.5rem 0.85rem;
    font: inherit;
    cursor: pointer;
    text-decoration: none;
    min-height: 2.5rem;
  }
  button.secondary, .btn.secondary { background: var(--btn-secondary); color: #fff; }
  .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  th, td { text-align: left; padding: 0.35rem 0.4rem; border-bottom: 1px solid var(--line); }
  .login-wrap { max-width: 24rem; margin: 4rem auto; padding: 0 1rem 3rem; }
  dialog {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1rem;
    background: var(--card);
    color: var(--ink);
    max-width: calc(100vw - 2rem);
  }
  dialog img { display: block; max-width: min(256px, 100%); height: auto; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    border: 0;
  }
  .selected { outline: 2px solid var(--accent); }
  .theme-form { margin: 0; }
  button.theme-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.5rem;
    height: 2.5rem;
    min-height: 2.5rem;
    padding: 0;
    background: none;
    color: var(--ink);
    border-radius: 8px;
  }
  button.theme-toggle:hover { color: var(--accent); background: var(--bg); }
  button.theme-toggle svg { display: block; width: 1.35rem; height: 1.35rem; }
  @media (max-width: 640px) {
    header {
      flex-direction: column;
      align-items: stretch;
      padding: 0.75rem 1rem;
    }
    nav { gap: 0.35rem 0.85rem; }
    .row { flex-direction: column; gap: 0.35rem; }
    .login-wrap { margin: 1.25rem auto; }
    h1 { font-size: 1.25rem; }
    .actions { flex-direction: column; align-items: stretch; }
    .actions form, .actions button, .actions .btn { width: 100%; }
  }
</style>
{{end}}

{{define "theme-toggle"}}
<form class="theme-form" method="post" action="/theme">
  <input type="hidden" name="theme" value="{{.NextTheme}}">
  <input type="hidden" name="next" value="{{.ReturnPath}}">
  <button type="submit" class="theme-toggle" title="{{.ThemeLabel}}" aria-label="{{.ThemeLabel}}">
    {{if eq .Theme "dark"}}
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
    </svg>
    {{else}}
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/>
    </svg>
    {{end}}
  </button>
</form>
{{end}}

{{define "nav"}}
<header>
  <div class="brand">
    <strong>AmneziaWG Panel</strong>
    {{template "theme-toggle" .}}
  </div>
  <nav>
    <a href="/peers">Peers</a>
    <a href="/exits">Exits</a>
    <a href="/account">Account</a>
    <span class="muted">{{.Username}}</span>
    <form method="post" action="/logout" style="margin:0">
      <button type="submit" class="link">Log out</button>
    </form>
  </nav>
</header>
{{end}}
